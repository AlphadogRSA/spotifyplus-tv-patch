name: Extension tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch test-only JSON implementation
        run: |
          mkdir -p .tools test-classes
          curl --fail --location --output .tools/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  .tools/json.jar' | sha256sum --check
      - name: Run deterministic tests
        run: |
          javac -encoding UTF-8 -cp .tools/json.jar -d test-classes src/dev/aurora/tvpatch/Lyrics.java src/dev/aurora/tvpatch/Provider.java tests/LyricsTest.java tests/ProviderTest.java
          java -ea -cp test-classes:.tools/json.jar LyricsTest
          java -ea -cp test-classes:.tools/json.jar ProviderTest
          javac -d test-classes src/dev/aurora/tvpatch/AdMuteState.java tests/AdMuteStateTest.java
          java -ea -cp test-classes AdMuteStateTest
          javac -d test-classes src/dev/aurora/tvpatch/AudioSessions.java tests/AudioSessionsTest.java
          java -ea -cp test-classes AudioSessionsTest
          javac -d test-classes src/dev/aurora/tvpatch/GraphicEq.java src/dev/aurora/tvpatch/AudioEffectPlan.java tests/AudioEffectPlanTest.java tests/GraphicEqTest.java
          java -ea -cp test-classes AudioEffectPlanTest
          java -ea -cp test-classes GraphicEqTest
          javac -d test-classes src/dev/aurora/tvpatch/SleepDeadline.java tests/SleepDeadlineTest.java
          java -ea -cp test-classes SleepDeadlineTest
          javac -d test-classes src/dev/aurora/tvpatch/SleepDeadline.java src/dev/aurora/tvpatch/HushPolicy.java tests/HushPolicyTest.java
          java -ea -cp test-classes HushPolicyTest
      - name: Test modular fingerprints
        run: bash revanced/gradlew -p revanced testFingerprints
      - name: Check source tools
        run: |
          python3 -m py_compile patch.py import_lyrics.py
          node -e "new Function('return ('+require('fs').readFileSync('assets/spotifyplus-tv.js','utf8')+')')"
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix .tools/browser --no-save --no-package-lock playwright@1.62.1
          node .tools/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check TV themes, promotion hiding and layout work
        env:
          NODE_PATH: ${{ github.workspace }}/.tools/browser/node_modules
        run: |
          node tests/presentation.test.cjs
          node tests/theme-regression.test.cjs
          node tests/presentation-performance.test.cjs
          node tests/native-settings.test.cjs
  rebuild-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare and test embedded helper sources
        run: |
          python3 -m unittest discover -s hush/tests -v
          python3 hush/prepare.py
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile single-app runtime
        run: |
          mkdir -p .tools/extension-classes .tools/extension-dex
          javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d .tools/extension-classes src/dev/aurora/tvpatch/*.java hush/build/generated/dev/aurora/tvpatch/hush/*.java
          jar cf .tools/extension.jar -C .tools/extension-classes .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output .tools/extension-dex .tools/extension.jar
      - name: Fetch verified prior release and build tools
        run: |
          curl --fail --location --output .tools/current.apks https://github.com/AlphadogRSA/spotifyplus-tv-patch/releases/download/v0.5.0/SpotifyPlus-TV-1.134.2-v0.5.apks
          curl --fail --location --output .tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl --fail --location --output .tools/apkeditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
      - name: Rebuild one unsigned APK
        run: python3 rebuild_release.py --input .tools/current.apks --dex .tools/extension-dex/classes.dex --apktool .tools/apktool.jar --apkeditor .tools/apkeditor.jar --output build/release-1.3.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-TV-1.3.0.1-unsigned
          path: |
            build/release-1.3.0.1/SpotifyPlus-TV-1.3.0.1-unsigned.apk
            build/release-1.3.0.1/SHA256.txt
          if-no-files-found: error
