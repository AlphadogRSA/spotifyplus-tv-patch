name: Extension tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch test-only JSON implementation
        run: |
          mkdir -p .tools test-classes
          curl --fail --location --output .tools/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  .tools/json.jar' | sha256sum --check
      - name: Run deterministic tests
        run: |
          javac -encoding UTF-8 -cp .tools/json.jar -d test-classes src/dev/aurora/tvpatch/Lyrics.java src/dev/aurora/tvpatch/Provider.java tests/LyricsTest.java tests/ProviderTest.java
          java -ea -cp test-classes:.tools/json.jar LyricsTest
          java -ea -cp test-classes:.tools/json.jar ProviderTest
          javac -d test-classes src/dev/aurora/tvpatch/AdMuteState.java tests/AdMuteStateTest.java
          java -ea -cp test-classes AdMuteStateTest
          javac -d test-classes src/dev/aurora/tvpatch/AudioSessions.java tests/AudioSessionsTest.java
          java -ea -cp test-classes AudioSessionsTest
          javac -d test-classes src/dev/aurora/tvpatch/AudioEffectPlan.java tests/AudioEffectPlanTest.java
          java -ea -cp test-classes AudioEffectPlanTest
          javac -d test-classes src/dev/aurora/tvpatch/SleepDeadline.java tests/SleepDeadlineTest.java
          java -ea -cp test-classes SleepDeadlineTest
          javac -d test-classes hush/overlay/java/io/coldmew/hush/TvSkipPolicy.java hush/tests/TvSkipPolicyTest.java
          java -ea -cp test-classes TvSkipPolicyTest
      - name: Test modular fingerprints
        run: bash revanced/gradlew -p revanced testFingerprints
      - name: Check source tools
        run: |
          python3 -m py_compile patch.py import_lyrics.py
          node -e "new Function('return ('+require('fs').readFileSync('assets/spotifyplus-tv.js','utf8')+')')"
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix .tools/browser --no-save --no-package-lock playwright@1.62.1
          node .tools/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check TV themes, promotion hiding and layout work
        env:
          NODE_PATH: ${{ github.workspace }}/.tools/browser/node_modules
        run: |
          node tests/presentation.test.cjs
          node tests/theme-regression.test.cjs
          node tests/presentation-performance.test.cjs
  hush-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare pinned Hush TV sources
        run: |
          python3 -m unittest discover -s hush/tests -v
          python3 hush/prepare.py
      - name: Install pinned Android build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile the complete TV extension and build its DEX
        run: |
          mkdir -p .tools/extension-classes .tools/extension-dex
          javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d .tools/extension-classes src/dev/aurora/tvpatch/*.java
          jar cf .tools/extension.jar -C .tools/extension-classes .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output .tools/extension-dex .tools/extension.jar
      - name: Test and build the Hush companion
        env:
          HUSH_SIGNING: /tmp/no-upstream-signing.properties
        run: bash hush/build/android/gradlew -p hush/build/android testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Hush-TV-unsigned
          path: |
            hush/build/android/app/build/outputs/apk/release/app-release-unsigned.apk
            hush/build/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
